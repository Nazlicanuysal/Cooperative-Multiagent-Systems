amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    transform_tolerance: 0.5
    laser_min_range: 0.3
    laser_max_range: 12.0
    max_particles: 3000
    min_particles: 800
    update_min_d: 0.10
    update_min_a: 0.15
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

