    robot_base_frame: base_link
    odom_topic: odom                      # Multi-agent namespace uyumu için '/' kaldırıldı
    bt_loop_duration: 20
    default_server_timeout: 50
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_rate_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 8.0
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 1. ÖNGÖRÜ UFKU (Miyopik yerel minimumu önlemek için T = 2.0s ufuk)
      time_steps: 40                        # 40 * 0.05 = 2.0 saniyelik öngörü ufku
      model_dt: 0.05                        # 20 Hz kontrol döngüsüyle tam senkronize
      batch_size: 1000                      # Monte Carlo örneklem sayısı (K = 1000)
      
      # 2. KİNEMATİK VE KİNODİNAMİK KISITLAR
      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.65
      vx_min: -0.10                         # Geri kaçışla oluşan spin salınımını sönümler
      wz_max: 1.2
      ax_max: 0.8
      ax_min: -1.0
      ay_max: 0.0
      az_max: 1.2
      
      # 3. A* KÜRESEL ROTA PENCERESİ VE BİLGİ KURAMSAL AĞIRLIKLANDIRMA
      iteration_count: 1
      prune_distance: 2.2                   # 2.0s ufuk için A* rotasından 2.2m kesit alır
      max_robot_pose_search_dist: 3.0       # 6x6 local_costmap yarıçapı ile tam uyumlu
      transform_tolerance: 0.5
      temperature: 0.35                     # Üstel ağırlıklandırma seçicilik sıcaklığı (lambda)
      gamma: 0.015                          # Kontrol eforu cezası
      motion_model: "DiffDrive"
      visualize: False
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        
      GoalCritic:
        enabled: true
        cost_power: 1                       # DRPA-MPPI doğrusal Öklid normu (1. derece)
        cost_weight: 8.0
        threshold_to_consider: 1.4
        
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5
        
      # DRPA-MPPI YEREL MİNİMUM (IN-PLACE ROTATION) KIRICI TERİMLER
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0                   # Olduğu yerde dönme/geri gitme tuzağını cezalandırır
        threshold_to_consider: 0.5
        
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.5               # İtici potansiyel alan (U_rep) ağırlığı artırıldı
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.15     # Duvara 15 cm kala güçlü itici gradyan devreye girer
        near_goal_distance: 0.5
        
      # A*-REHBERLİ (HYBRID A*-GUIDED) YÖRÜNGE TAKİP TERİMLERİ
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 8             # 8 * 0.05 = 0.40m ileriden hizalama başlatır
        use_path_orientations: false
        
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0                   # Ufuk sonunu (p_T) A* rotası boyunca ileri çeker (Tuzak kırıcı)
        offset_from_furthest: 8             # Hedef teğetini 0.40m ileride tutarak spin atmayı önler
        threshold_to_consider: 1.4
        
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0                    # Rotaya kavis alarak yönelmeyi hızlandırır
        offset_from_furthest: 8             # Yakın nokta kararsızlığını önlemek için 8 adıma çıkarıldı
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.65
        mode: 0                             # 0: İleri yönelim tercihi (Forward Preference)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.38, -0.32], [-0.38, 0.32]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan                    # KRİTİK: Alt düğümün kök '/scan' kanalını görmesi için '/' şart!
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      resolution: 0.05
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.38, -0.32], [-0.38, 0.32]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan                    # KRİTİK: Alt düğümün kök '/scan' kanalını görmesi için '/' şart!
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.3
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map                   # Statik haritanın her zaman yüklenmesini garanti eder
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/nazlican/dev_ws/src/rob_one/maps/map_saved.yaml"

planner_server:
  ros__parameters:
    use_sim_time: True
    tolerance: 0.5
    use_astar: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      acceleration_limit: 0.5
      deceleration_limit: -0.8
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      acceleration_limit: 0.5
      deceleration_limit: -0.8
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.65, 0.0, 1.2]
    min_velocity: [-0.10, 0.0, -1.2]        # MPPI vx_min (-0.10) ile birebir eşitlendi
    max_accel: [0.8, 0.0, 1.2]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]